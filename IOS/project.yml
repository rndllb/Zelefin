name: Zelefin
options:
  bundleIdPrefix: app.zelefin
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "0.1.0"
    # iOS build number. Lives here so `xcodegen generate` preserves it instead of resetting
    # the number set in Xcode — bump this value when cutting a TestFlight build.
    CURRENT_PROJECT_VERSION: "22"
    # Signing team, kept here so regeneration never strips it from the targets.
    DEVELOPMENT_TEAM: F7YZT72GUX
    GENERATE_INFOPLIST_FILE: YES
    DISABLE_DIAMOND_PROBLEM_DIAGNOSTIC: YES
    INFOPLIST_KEY_CFBundleDisplayName: Zelefin
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
packages:
  JellyfinAPI:
    url: https://github.com/jellyfin/jellyfin-sdk-swift.git
    from: "1.0.0"
  ZelefinMPV:
    path: Packages/ZelefinMPV
targets:
  Zelefin:
    type: application
    platform: iOS
    supportedDestinations: [iOS, macCatalyst]
    sources:
      - path: Zelefin
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.zelefin.client
        ASSETCATALOG_COMPILER_APPICON_NAME: Zelefin
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: YES
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Zelefin reads your Wi-Fi name so it can use your local Jellyfin address when you’re home."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Zelefin uses Face ID or Touch ID to unlock a switch PIN when changing accounts on this device."
        INFOPLIST_KEY_UIBackgroundModes: "audio remote-notification"
        INFOPLIST_KEY_UILaunchScreen_UIColorName: LaunchBackground
        INFOPLIST_KEY_UILaunchScreen_UIImageName: LaunchMark
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: YES
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        # Mac Catalyst runs as the Mac idiom ("Optimize Interface for Mac"): AppKit draws the split view's
        # sidebar full height, with the window buttons inside it.
        "TARGETED_DEVICE_FAMILY[sdk=macosx*]": "1,2,6"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Zelefin/Zelefin.entitlements
        # Mac Catalyst: no Wi-Fi info entitlement there, and the Mac needs App Sandbox with network access.
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Zelefin/Zelefin-Mac.entitlements
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies:
      - package: JellyfinAPI
        product: JellyfinAPI
      - package: ZelefinMPV
        product: ZelefinMPV
      # AppKit for the Mac sidebar (no collapsing, fixed width, no sidebar button), loaded from PlugIns.
      - target: ZelefinMacBridge
        platformFilter: macCatalyst
        embed: true
        copy:
          destination: plugins
      # Download Live Activity (Lock Screen + Dynamic Island). iPhone/iPad only — not on Mac Catalyst.
      - target: ZelefinDownloadsWidget
        platformFilter: iOS
        embed: true
    postBuildScripts:
      - name: Generate framework dSYMs
        basedOnDependencyAnalysis: false
        runOnlyWhenInstalling: true
        inputFiles:
          - $(SRCROOT)/scripts/generate-framework-dsyms.sh
        script: |
          sh "${SRCROOT}/scripts/generate-framework-dsyms.sh"
    info:
      path: Zelefin/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: app.zelefin.client
            CFBundleURLSchemes:
              - zelefin
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiresFullScreen: false
        # Download progress on the Lock Screen and in the Dynamic Island.
        NSSupportsLiveActivities: true
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
        NSLocationWhenInUseUsageDescription: "Zelefin reads your Wi-Fi name so it can use your local Jellyfin address when you’re home."
        NSFaceIDUsageDescription: "Zelefin uses Face ID or Touch ID to unlock a switch PIN when changing accounts on this device."
        # Kept here so regeneration doesn't strip them from Info.plist.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSCameraUsageDescription: "Zelefin does not use the camera. A video library built into its player can capture from a camera, so iOS asks apps that include it to explain why; Zelefin never turns it on."
        NSMicrophoneUsageDescription: "Zelefin does not use the microphone. A video library built into its player can record audio, so iOS asks apps that include it to explain why; Zelefin never turns it on."
        NSLocalNetworkUsageDescription: "Zelefin connects to Jellyfin, Seerr, and Ombi servers on your home network."
        UIBackgroundModes:
          - audio
          - remote-notification
  ZelefinMacBridge:
    type: bundle
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: ZelefinMacBridge
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.zelefin.client.MacBridge
        INFOPLIST_FILE: ZelefinMacBridge/Info.plist
        WRAPPER_EXTENSION: bundle
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
  ZelefinDownloadsWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ZelefinDownloadsWidget
        excludes:
          - Info.plist
      # The Live Activity contract, shared with the app (which also compiles it via its glob).
      - path: Zelefin/Core/LiveActivities/ZelefinActivityAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.zelefin.client.DownloadsWidget
        INFOPLIST_FILE: ZelefinDownloadsWidget/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Zelefin Downloads
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
  ZelefinTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ZelefinTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.zelefin.client.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
    dependencies:
      - target: Zelefin
schemes:
  Zelefin:
    build:
      targets:
        Zelefin: all
        ZelefinTests: [test]
    test:
      targets:
        - ZelefinTests
