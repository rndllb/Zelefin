opt_in_rules:
  - empty_count
  - explicit_init
  - fatal_error_message
  - overridden_super_call
  - redundant_nil_coalescing
  - vertical_parameter_alignment_on_call
disabled_rules:
  - trailing_whitespace
  - line_length
  - todo
force_unwrapping: error
force_cast: error
force_try: error
identifier_name:
  min_length: 2
  excluded:
    - id
    - x
    - y
    - i
    - ok
reporter: xcode
